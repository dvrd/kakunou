version: '3'

env:
  KAKUNOU_COMPILER: '{{.ODIN | default "odin"}}'
  KAKUNOU_SHARED: '{{.SHARED | default .WEBTOOLS_SHARED | default ""}}'
  KAKUNOU_PACKAGE: '{{.PACKAGE | default "all"}}'
  KAKUNOU_INTERNAL: '{{.INTERNAL | default "0"}}'
  KAKUNOU_OUT: '{{.CHECK_DIR | default .KAKUNOU_CHECK_DIR | default ""}}'

tasks:
  run-odin:
    internal: true
    silent: true
    cmds:
      - |
        sh -eu -c '
          package=$1
          shift
          runner_dir=$(mktemp -d "${TMPDIR:-/tmp}/kakunou-task-XXXXXXXX")
          cleanup() { rm -f "$runner_dir/runner"; rmdir "$runner_dir"; }
          trap cleanup EXIT
          trap "exit 1" HUP INT TERM
          "$KAKUNOU_COMPILER" run "$package" -out:"$runner_dir/runner" "$@"
        ' run-odin {{.ODIN_ARGS}}

  default:
    desc: Type-check, build, and test
    aliases: [check]
    cmds:
      - task: build
      - task: test

  build:
    desc: Type-check and build the library suites and version tool
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/check -vet -warnings-as-errors -- build {{.CLI_ARGS}}' }

  test:
    silent: true
    desc: Run unit and integration tests
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/check -vet -warnings-as-errors -- test {{.CLI_ARGS}}' }

  reliability:
    desc: Exercise concurrent WAL writes, checkpoints, backups, and restores
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/reliability -o:speed -vet -warnings-as-errors {{.CLI_ARGS}}' }

  version:
    desc: Print the release tag
    silent: true
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/version -- current' }

  version:next:
    desc: Print the next tag from Conventional Commits since the latest release
    silent: true
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/version -- next' }

  version:prepare:
    desc: Prepare the version literal for a pull request against origin/main
    silent: true
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/version -- prepare' }

  release:
    desc: Check the tree, commit the next release tag, and annotate it
    cmds:
      - task: run-odin
        vars: { ODIN_ARGS: 'tools/version -- release' }
