version: '3'

vars:
  RUNNER: '{{.TMPDIR | default "/tmp"}}/kakunou-task-{{(now).UnixNano}}'

env:
  KAKUNOU_COMPILER: '{{.ODIN | default "odin"}}'
  KAKUNOU_SHARED: '{{.SHARED | default .WEBTOOLS_SHARED | default ""}}'
  KAKUNOU_PACKAGE: '{{.PACKAGE | default "all"}}'
  KAKUNOU_INTERNAL: '{{.INTERNAL | default "0"}}'
  KAKUNOU_OUT: '{{.CHECK_DIR | default .KAKUNOU_CHECK_DIR | default ""}}'

tasks:
  default:
    desc: Type-check, build, and test
    aliases: [check]
    cmds:
      - task: build
      - task: test

  build:
    desc: Type-check and build the library suites and version tool
    cmds:
      - '"$KAKUNOU_COMPILER" run tools/check -vet -warnings-as-errors -out:"{{.RUNNER}}" -- build {{.CLI_ARGS}}'

  test:
    desc: Run the library suites and version-tool tests
    cmds:
      - '"$KAKUNOU_COMPILER" run tools/check -vet -warnings-as-errors -out:"{{.RUNNER}}" -- test {{.CLI_ARGS}}'

  version:
    desc: Print the release tag
    silent: true
    cmds:
      - '"$KAKUNOU_COMPILER" run tools/version -out:"{{.RUNNER}}" -- current'

  version:next:
    desc: Print the next tag from Conventional Commits since the latest release
    silent: true
    cmds:
      - '"$KAKUNOU_COMPILER" run tools/version -out:"{{.RUNNER}}" -- next'

  release:
    desc: Check the tree, commit the next release tag, and annotate it
    cmds:
      - '"$KAKUNOU_COMPILER" run tools/version -out:"{{.RUNNER}}" -- release'
