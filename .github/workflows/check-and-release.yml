name: Check and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: task check

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Check and tag the release
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          next=$(task version:next)
          task release
          if [[ -n "$next" ]]; then
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          else
            # A rerun can resume publication after a successful atomic push.
            tag=$(task version)
            if [[ $(git log -1 --format=%ae "$tag") == '41898282+github-actions[bot]@users.noreply.github.com' ]]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
